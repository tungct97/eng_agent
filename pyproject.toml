[project]
name = "english-agent"
version = "0.2.0"
description = "English tutor chạy local: OCR sách scan -> chunk -> vector DB -> LLM (Ollama)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.7.6",
    "langchain-huggingface>=1.2.3",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "sentence-transformers>=6.2.0",
    "numpy>=2.4.6",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "pytesseract>=0.3.13",
]

[project.optional-dependencies]
pdf = ["pypdf>=7.0.0"]  # chỉ cần nếu dùng `eng-agent ocr --pdf`

[project.scripts]
eng-agent = "english_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/english_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
